<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nishans Chatbot — Cinematic AI Experience</title>
  <!-- Google Fonts: Luxury Serif & Modern Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030304;
      color: #ededed;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #08080c 0%, #030304 85%);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Ambient Film Grain & Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(2, 2, 4, 0.85) 100%);
      z-index: 4;
    }

    /* Top Metadata Header (matching Vadim Carazan reference) */
    .header-bar {
      position: absolute;
      top: 28px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(230, 230, 235, 0.7);
      pointer-events: auto;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }

    .logo-glyph {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .brand-logo:hover .logo-glyph {
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
    }

    .meta-group {
      line-height: 1.5;
    }

    .meta-label {
      color: rgba(255, 255, 255, 0.35);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta-val {
      color: rgba(240, 240, 245, 0.85);
      font-weight: 400;
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Oversized Background Typography (Vadim Carazan style) */
    .bg-title-container {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 2s ease, transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bg-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(64px, 12vw, 170px);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: -0.02em;
      line-height: 0.9;
      white-space: nowrap;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    /* Bottom Info & Enter Button */
    .footer-bar {
      position: absolute;
      bottom: 34px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: auto;
    }

    .footer-desc {
      max-width: 320px;
      font-size: 11px;
      line-height: 1.6;
      color: rgba(220, 220, 230, 0.55);
      letter-spacing: 0.02em;
    }

    .enter-btn-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .enter-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25);
    }

    .enter-btn .arrow-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }

    .enter-btn:hover .arrow-icon {
      transform: translateX(3px);
    }

    .shortcut-badge {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.05em;
    }

    /* Signature Curve SVG */
    .signature-svg {
      position: absolute;
      top: 15%;
      left: 8%;
      width: 84%;
      height: 70%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.28;
    }

    .sig-path {
      stroke: #ffffff;
      stroke-width: 1.2;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      transition: stroke-dashoffset 4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
    }

    /* Transition Fade Out State */
    .exit-animation {
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0 !important;
      transform: scale(1.05);
      filter: blur(12px);
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- Canvas for Particle Physics -->
    <canvas id="particleCanvas"></canvas>

    <!-- Artistic Signature Curve (Vadim Carazan Line Art Reference) -->
    <svg class="signature-svg" viewBox="0 0 1000 700" fill="none">
      <path class="sig-path" id="sigPath" d="M 50 350 Q 200 80, 480 320 T 750 200 Q 920 120, 980 280 M 220 160 L 210 520 M 180 360 C 280 280, 360 480, 420 380" />
    </svg>

    <!-- Top Metadata Header -->
    <div class="header-bar">
      <a href="#" class="brand-logo" id="logoLink">
        <div class="logo-glyph">NC</div>
      </a>

      <div class="meta-group">
        <div class="meta-label">Currently:</div>
        <div class="meta-val">AI Agentic Assistant</div>
      </div>

      <div class="meta-group" style="text-align: center;">
        <div class="meta-label">Engine & Node:</div>
        <div class="meta-val"><span class="live-dot"></span>Gemini 3.5 Flash | Active</div>
      </div>

      <div class="meta-group" style="text-align: right;">
        <div class="meta-label">Navigation:</div>
        <div class="meta-val">Chat • Tools • Notes</div>
      </div>
    </div>

    <!-- Oversized Elegant Typography (Behind Portrait) -->
    <div class="bg-title-container" id="bgTitle">
      <h1 class="bg-title">Nishan Shetty</h1>
    </div>

    <!-- Bottom Footer & CTA -->
    <div class="footer-bar">
      <div class="footer-desc">
        Fourteen layers of neural reasoning, autonomous tool synthesis, and human-in-the-loop validation. Built on MacBook Air M4.
      </div>

      <div class="enter-btn-wrap">
        <button class="enter-btn" id="enterBtn">
          <span>Enter Chatbot</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
          <span class="shortcut-badge">↵</span>
        </button>
      </div>
    </div>

    <div class="vignette"></div>
  </div>

  <!-- Load portrait particle dataset -->
  <script src="./particles_data.js"></script>

  <script>
    (function() {
      // -------------------------------------------------------------
      // 1. Canvas & Responsive Sizing Setup
      // -------------------------------------------------------------
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      const bgTitle = document.getElementById('bgTitle');
      const sigPath = document.getElementById('sigPath');
      const enterBtn = document.getElementById('enterBtn');
      const stage = document.getElementById('stage');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        notifyStreamlitFrameHeight();
      }

      window.addEventListener('resize', resize);
      resize();

      // Notify Streamlit iframe height
      function notifyStreamlitFrameHeight() {
        if (window.parent) {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height: window.innerHeight
          }, "*");
        }
      }

      // -------------------------------------------------------------
      // 2. Particle Class & Physics Simulation
      // -------------------------------------------------------------
      class Particle {
        constructor(config, index) {
          this.index = index;
          // Target coordinate mapped to screen space
          this.normTargetX = config.x;
          this.normTargetY = config.y;
          this.colorR = config.r;
          this.colorG = config.g;
          this.colorB = config.b;
          this.baseSize = config.size || 2.0;
          this.shape = config.shape || 'circle';
          this.isEdge = config.edge || false;

          // Start in darkness: dispersed across wide random space
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * Math.max(width, height) * 0.9 + 150;
          this.x = width / 2 + Math.cos(angle) * radius;
          this.y = height / 2 + Math.sin(angle) * radius;

          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = (Math.random() - 0.5) * 1.5;

          this.targetX = 0;
          this.targetY = 0;

          // Staggered emergence & individual spring damping
          this.delay = 0.5 + Math.random() * 1.4; // seconds before attraction begins
          this.spring = 0.038 + Math.random() * 0.025;
          this.friction = 0.86 + Math.random() * 0.05;

          // Shimmer and organic micro-drift
          this.driftSpeed = 0.8 + Math.random() * 1.2;
          this.driftPhase = Math.random() * Math.PI * 2;
          this.alpha = 0.0;
          this.glint = Math.random() > 0.85;
        }

        computeTarget(portraitScale, portraitCenterY) {
          // Map normalized coords (-1..1) to responsive viewport
          this.targetX = (width / 2) + (this.normTargetX * portraitScale);
          this.targetY = portraitCenterY + (this.normTargetY * portraitScale);
        }

        update(elapsedTime, mouseX, mouseY, isExiting) {
          if (isExiting) {
            // Disperse outwards rapidly on exit
            const dx = this.x - width / 2;
            const dy = this.y - height / 2;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            this.vx += (dx / dist) * 2.8;
            this.vy += (dy / dist) * 2.8;
            this.alpha *= 0.94;
            this.x += this.vx;
            this.y += this.vy;
            return;
          }

          if (elapsedTime < this.delay) {
            // Floating in darkness phase
            this.x += this.vx;
            this.y += this.vy;
            this.alpha = Math.min(0.65, this.alpha + 0.02);
            return;
          }

          // Convergence phase: Spring force toward target
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;

          this.vx += dx * this.spring;
          this.vy += dy * this.spring;
          this.vx *= this.friction;
          this.vy *= this.friction;

          // Interactive subtle mouse repulsion
          if (mouseX !== null && mouseY !== null) {
            const mdx = this.x - mouseX;
            const mdy = this.y - mouseY;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < 100) {
              const force = (1 - mdist / 100) * 4.5;
              this.vx += (mdx / mdist) * force;
              this.vy += (mdy / mdist) * force;
            }
          }

          // Subtle organic breathing drift when formed
          if (elapsedTime > 3.8) {
            this.driftPhase += 0.03 * this.driftSpeed;
            this.x += Math.sin(this.driftPhase) * 0.18;
            this.y += Math.cos(this.driftPhase) * 0.18;
          }

          this.x += this.vx;
          this.y += this.vy;

          // Fade in to full opacity
          if (this.alpha < 0.95) {
            this.alpha += 0.03;
          }
        }

        draw(ctx, elapsedTime) {
          if (this.alpha <= 0.01) return;

          let size = this.baseSize;
          let r = this.colorR;
          let g = this.colorG;
          let b = this.colorB;
          let a = this.alpha;

          // Occasional subtle glint/sparkle highlight
          if (this.glint) {
            const pulse = (Math.sin(elapsedTime * 3 + this.index) + 1) * 0.5;
            if (pulse > 0.85) {
              size *= 1.35;
              r = Math.min(255, r + 90);
              g = Math.min(255, g + 100);
              b = Math.min(255, b + 120);
            }
          }

          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;

          if (this.shape === 'square') {
            ctx.fillRect(this.x - size / 2, this.y - size / 2, size, size);
          } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // -------------------------------------------------------------
      // 3. Ambient Star / Floating Dust Layer
      // -------------------------------------------------------------
      const ambientStars = [];
      const STAR_COUNT = 140;

      for (let i = 0; i < STAR_COUNT; i++) {
        ambientStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          size: Math.random() * 1.6 + 0.6,
          alpha: Math.random() * 0.5 + 0.2,
          pulseSpeed: Math.random() * 0.02 + 0.01,
          pulseVal: Math.random() * Math.PI,
        });
      }

      function updateAndDrawAmbient(ctx, isExiting) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for (let s of ambientStars) {
          if (!isExiting) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < 0) s.x = width;
            if (s.x > width) s.x = 0;
            if (s.y < 0) s.y = height;
            if (s.y > height) s.y = 0;
            s.pulseVal += s.pulseSpeed;
          }

          const currentAlpha = s.alpha * ((Math.sin(s.pulseVal) + 1) * 0.35 + 0.4);
          ctx.fillStyle = `rgba(235, 240, 255, ${currentAlpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // -------------------------------------------------------------
      // 4. Initialize Portrait Particles from Dataset
      // -------------------------------------------------------------
      const particles = [];
      if (typeof PORTRAIT_PARTICLES !== 'undefined' && Array.isArray(PORTRAIT_PARTICLES)) {
        for (let i = 0; i < PORTRAIT_PARTICLES.length; i++) {
          particles.push(new Particle(PORTRAIT_PARTICLES[i], i));
        }
      } else {
        console.warn('PORTRAIT_PARTICLES dataset not found. Generating fallback luminous grid.');
      }

      // Responsive portrait scaling: maintain perfect proportion
      function updateParticleTargets() {
        const minDim = Math.min(width, height);
        // Portrait scale: takes ~48% of screen height
        const portraitScale = minDim * 0.44;
        const portraitCenterY = height * 0.43;

        for (let p of particles) {
          p.computeTarget(portraitScale, portraitCenterY);
        }
      }
      updateParticleTargets();
      window.addEventListener('resize', updateParticleTargets);

      // Mouse tracking
      let mouseX = null;
      let mouseY = null;
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouseX = null;
        mouseY = null;
      });

      // -------------------------------------------------------------
      // 5. Animation Loop & Orchestration
      // -------------------------------------------------------------
      let startTime = null;
      let isExiting = false;

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) / 1000; // in seconds

        // Clear canvas with gentle trail
        ctx.fillStyle = 'rgba(3, 3, 4, 0.42)';
        ctx.fillRect(0, 0, width, height);

        // Draw ambient dust & stars
        updateAndDrawAmbient(ctx, isExiting);

        // Update and draw portrait particles
        for (let p of particles) {
          p.update(elapsed, mouseX, mouseY, isExiting);
          p.draw(ctx, elapsed);
        }

        // Trigger Signature path draw after 1.8s
        if (elapsed > 1.8 && sigPath) {
          sigPath.style.strokeDashoffset = '0';
        }

        // Trigger Background Typography reveal after 2.8s
        if (elapsed > 2.8 && bgTitle) {
          bgTitle.style.opacity = '1';
          bgTitle.style.transform = 'translateY(0px)';
        }

      // Streamlit Handshake
      if (window.parent) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1
        }, "*");
      }

      requestAnimationFrame(render);


      // -------------------------------------------------------------
      // 6. Enter Chatbot Transition & Streamlit Handshake
      // -------------------------------------------------------------
      function triggerEnterTransition() {
        if (isExiting) return;
        isExiting = true;

        // Visual fade out
        stage.classList.add('exit-animation');

        // Send value to Streamlit
        setTimeout(() => {
          if (window.parent) {
            window.parent.postMessage({
              isStreamlitMessage: true,
              type: "streamlit:setComponentValue",
              value: { action: "entered" }
            }, "*");
          }
        }, 800);
      }

      enterBtn.addEventListener('click', triggerEnterTransition);

      // Keyboard shortcut: Press Enter or Space to proceed
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          triggerEnterTransition();
        }
      });

    })();
  </script>
</body>
</html>
